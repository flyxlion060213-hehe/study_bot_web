<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBot - Mộng Cam</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 95%; max-width: 450px; height: 85vh; background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        header { padding: 18px; background: var(--primary); color: white; text-align: center; font-weight: 600; }
        #chat { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 15px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
        .user { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot { background: #eff6ff; color: #1e293b; align-self: flex-start; border-bottom-left-radius: 2px; }
        .input-area { padding: 15px; border-top: 1px solid #f1f5f9; display: flex; gap: 8px; }
        input { flex: 1; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 12px; outline: none; }
        button { background: var(--primary); color: white; border: none; padding: 0 18px; border-radius: 12px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <header>🎓 StudyBot - Mộng Cam</header>
    <div id="chat"></div>
    <div class="input-area">
        <input id="question" placeholder="Hỏi bài tập..." autocomplete="off">
        <button onclick="send()">Gửi</button>
    </div>
</div>
<script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("question");

    function add(text, type) {
        const div = document.createElement("div");
        div.className = `msg ${type}`;
        div.innerText = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    async function send() {
        const q = input.value.trim();
        if (!q) return;

        add(q, 'user');
        input.value = "";
        const loading = add("Mộng Cam đang suy nghĩ...", 'bot');

        try {
            const r = await fetch("/ask", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ question: q }) // Gửi biến 'question'
            });
            const d = await r.json();
            
            loading.remove(); // Xóa dòng "đang suy nghĩ"
            
            // d.answer lấy từ JSON của Python trả về
            if (d.answer) {
                add(d.answer, 'bot');
            } else {
                add("Lỗi: Không nhận được phản hồi từ AI.", 'bot');
            }
        } catch (e) {
            loading.innerText = "❌ Lỗi kết nối server!";
        }
    }
    input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
    window.onload = () => add("Chào bạn! Mình là Mộng Cam. Bạn cần giúp gì nào?", 'bot');
</script>
</body>
</html>
