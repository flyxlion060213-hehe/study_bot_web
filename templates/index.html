<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Study Bot AI</title>

<style>
body {
    background: #eef2f7;
    font-family: Arial;
    display: flex;
    justify-content: center;
    padding-top: 40px;
}

.container {
    width: 420px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 8px 25px rgba(0,0,0,.15);
    padding: 20px;
}

h2 {
    text-align: center;
    margin-bottom: 10px;
}

#chat {
    height: 420px;
    overflow-y: auto;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 10px;
    white-space: pre-wrap;
}

.input-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

#question {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #bbb;
}

button {
    padding: 10px 14px;
    border-radius: 10px;
    border: none;
    background: #4f7cff;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #3f66d6;
}
</style>
</head>

<body>
<div class="container">
    <h2>🎓 Study Bot AI</h2>

    <div id="chat"></div>

    <div class="input-row">
        <input id="question" placeholder="Nhập câu hỏi..." />
        <button onclick="send()">Gửi</button>
    </div>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("question");

const userId = localStorage.getItem("user_id") || Date.now();
localStorage.setItem("user_id", userId);

// gửi bằng Enter
input.addEventListener("keydown", e => {
    if (e.key === "Enter") send();
});

function add(msg) {
    chat.innerText += msg + "\n\n";
    chat.scrollTop = chat.scrollHeight;
}

function send() {
    const q = input.value.trim();
    if (!q) return;
    add("👤 Bạn: " + q);
    input.value = "";

    fetch("/ask", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            user_id: userId,
            question: q
        })
    })
    .then(r => r.json())
    .then(d => {
        add("🤖 Mộng Cam: " + d.answer + "\n🎯 " + d.rank);
    })
    .catch(() => add("❌ Lỗi kết nối server"));
}

// bot tự giới thiệu
window.onload = () => {
    add("🤖 Xin chào! Mình là **ex Mộng Cam**, trợ lý học tập AI.\nHỏi mình bất cứ điều gì nhé!");
};
</script>

</body>
</html>
