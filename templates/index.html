<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Study Bot AI</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; padding: 20px; background: #f0f2f5; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { color: #1a73e8; text-align: center; margin-top: 0; }
        #chat { border: 1px solid #e0e0e0; padding: 15px; height: 450px; overflow-y: auto; background: #fafafa; border-radius: 10px; font-size: 15px; white-space: pre-wrap; margin-bottom: 15px; line-height: 1.5; }
        .input-row { display: flex; gap: 10px; }
        #question { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ddd; outline: none; transition: 0.3s; }
        #question:focus { border-color: #1a73e8; }
        button { padding: 10px 20px; border: none; border-radius: 8px; background: #1a73e8; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #1557b0; }
        .rank-box { font-size: 13px; color: #666; margin-bottom: 10px; text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎓 Study Bot AI</h2>
    <div id="rank-display" class="rank-box">Rank: Đang tải...</div>
    <div id="chat"></div>
    <div class="input-row">
        <input type="text" id="question" placeholder="Hỏi Khương Hoàn Mỹ về hóa học hoặc địa lý...">
        <button onclick="sendQuestion()">Gửi</button>
    </div>
</div>

<script>
    let userId = localStorage.getItem("user_id") || "user_" + Date.now();
    localStorage.setItem("user_id", userId);

    const chat = document.getElementById("chat");
    const input = document.getElementById("question");
    const rankDisplay = document.getElementById("rank-display");

    function appendMessage(msg) {
        chat.innerText += msg + "\n\n";
        chat.scrollTop = chat.scrollHeight;
    }

async function sendQuestion() {
    const q = input.value.trim();
    if (!q) return;

    // 1. Tìm nút gửi và khóa nó lại
    const btn = document.querySelector("button");
    btn.disabled = true;
    btn.style.opacity = "0.5";
    btn.innerText = "⏳...";

    appendMessage("👤 Bạn: " + q);
    input.value = "";
    appendMessage("🤖 Khương Hoàn Mỹ đang suy nghĩ...");

    try {
        const response = await fetch("/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_id: userId, question: q })
        });
        const data = await response.json();
        
        // 2. Xóa dòng "đang suy nghĩ"
        const lines = chat.innerText.split("\n\n");
        lines.pop(); 
        chat.innerText = lines.join("\n\n") + "\n\n";

        // 3. Hiển thị câu trả lời
        if (data.answer) {
            appendMessage("🤖 Khương Hoàn Mỹ: " + data.answer);
            rankDisplay.innerText = "Rank: " + data.rank;
        } else {
            appendMessage("🤖 Khương Hoàn Mỹ: Rất tiếc, mình đang bị quá tải (Quota limit). Bạn đợi xíu rồi hỏi lại nhé!");
        }

    } catch (err) {
        appendMessage("❌ Lỗi: Không thể kết nối máy chủ.");
    } finally {
        // 4. Mở khóa nút bấm để người dùng hỏi câu tiếp theo
        btn.disabled = false;
        btn.style.opacity = "1";
        btn.innerText = "Gửi";
    }
}
    }

    input.addEventListener("keypress", (e) => { if (e.key === "Enter") sendQuestion(); });

    window.onload = () => {
        appendMessage("🤖 Chào bạn! Mình là Khương Hoàn Mỹ. Hãy đặt câu hỏi cho mình nhé!");
    };
</script>

</body>
</html>
