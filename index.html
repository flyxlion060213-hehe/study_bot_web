<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyBot AI - Modern Interface</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-soft: #dbeafe;
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --white: #ffffff;
      --text-dark: #0f172a;
      --text-light: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 550px;
      height: 90vh;
      background: var(--white);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      margin: 10px;
    }

    header {
      padding: 24px;
      background: var(--white);
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bot-avatar {
      width: 40px;
      height: 40px;
      background: var(--primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
    }

    header h2 { font-size: 18px; color: var(--text-dark); }
    header p { font-size: 13px; color: var(--text-light); }

    #chatbox {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background-image: radial-gradient(#e2e8f0 0.5px, transparent 0.5px);
      background-size: 20px 20px;
    }

    .msg {
      max-width: 80%;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .bot-msg {
      background: #f1f5f9;
      color: var(--text-dark);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .user-msg {
      background: var(--primary);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    .input-area {
      padding: 20px;
      background: var(--white);
      border-top: 1px solid #f1f5f9;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 14px 20px;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      outline: none;
      font-size: 15px;
      transition: all 0.2s;
    }

    input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0 24px;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover { background: #1d4ed8; transform: scale(1.02); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="bot-avatar">🎓</div>
      <div>
        <h2>StudyBot AI</h2>
        <p>● Trực tuyến</p>
      </div>
    </header>

    <div id="chatbox"></div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Nhập câu hỏi học tập..." autocomplete="off">
      <button onclick="sendMessage()">Gửi</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const chatbox = document.getElementById('chatbox');
    const input = document.getElementById('userInput');

    // Chào mừng khi mới vào
    window.onload = () => {
      appendMsg("Chào bạn! Mình có thể giải bài tập hoặc giải thích kiến thức gì cho bạn không?", 'bot-msg');
    };

    async function sendMessage() {
      const text = input.value.trim();
      if(!text) return;

      appendMsg(text, 'user-msg');
      input.value = '';

      const loading = appendMsg("Đang suy nghĩ...", 'bot-msg');

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${CONFIG.API_KEY}`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
        });

        const data = await response.json();
        loading.remove();

        if (data.candidates) {
          appendMsg(data.candidates[0].content.parts[0].text, 'bot-msg');
        } else {
          appendMsg("Lỗi: Kiểm tra lại API Key hoặc nội dung câu hỏi.", 'bot-msg');
        }
      } catch (e) {
        loading.innerText = "Lỗi kết nối server!";
      }
    }

    function appendMsg(text, type) {
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerText = text;
      chatbox.appendChild(div);
      chatbox.scrollTop = chatbox.scrollHeight;
      return div;
    }

    input.addEventListener("keypress", (e) => { if(e.key === "Enter") sendMessage(); });
  </script>
</body>
</html>
