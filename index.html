<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GEMINI AI - FUTURE TERMINAL</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --cyan: #00f2ff; --bg: #050a18; }
    body { background: var(--bg); color: white; font-family: 'Rajdhani', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
    
    .terminal {
      width: 90%; max-width: 700px; height: 85vh;
      background: rgba(10, 20, 50, 0.9);
      border: 1px solid var(--cyan);
      display: flex; flex-direction: column;
      box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
      clip-path: polygon(0 0, 95% 0, 100% 5%, 100% 100%, 5% 100%, 0 95%);
    }

    #chat-content { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    
    .msg { padding: 10px 15px; border-radius: 4px; max-width: 85%; font-size: 1.1rem; line-height: 1.4; }
    .user { align-self: flex-end; background: rgba(0, 242, 255, 0.15); border-right: 3px solid var(--cyan); }
    .ai { align-self: flex-start; background: rgba(255, 255, 255, 0.05); border-left: 3px solid #ff00ff; color: #e0e0e0; }

    .input-box { display: flex; padding: 20px; border-top: 1px solid rgba(0, 242, 255, 0.2); }
    input { flex: 1; background: transparent; border: none; color: var(--cyan); font-family: 'Rajdhani'; font-size: 1.2rem; outline: none; }
    button { background: transparent; border: 1px solid var(--cyan); color: var(--cyan); font-family: 'Orbitron'; cursor: pointer; padding: 10px 20px; transition: 0.3s; }
    button:hover { background: var(--cyan); color: black; box-shadow: 0 0 15px var(--cyan); }
    
    /* Loading animation */
    .typing { font-style: italic; opacity: 0.7; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="terminal">
  <div style="padding: 10px; background: rgba(0, 242, 255, 0.1); font-family: 'Orbitron'; font-size: 0.8rem; letter-spacing: 2px;">
    > GEMINI_CORE_LINK_ESTABLISHED
  </div>
  
  <div id="chat-content">
    <div class="msg ai">Hệ thống đã kết nối với Gemini AI. Nhập câu hỏi của bạn...</div>
  </div>

  <div class="input-box">
    <input type="text" id="userInput" placeholder="Gõ lệnh hoặc câu hỏi..." autocomplete="off">
    <button onclick="askGemini()">SEND</button>
  </div>
</div>

<script type="module">
  // Import thư viện Google Generative AI từ CDN
  import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

  // --- CẤU HÌNH TẠI ĐÂY ---
  const API_KEY = "DÁN_API_KEY_CỦA_BẠN_VÀO_ĐÂY"; 
  // -----------------------

  const genAI = new GoogleGenerativeAI(API_KEY);
  const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

  window.askGemini = async function() {
    const input = document.getElementById('userInput');
    const chatContent = document.getElementById('chat-content');
    const text = input.value.trim();

    if (!text) return;

    // Hiển thị câu hỏi của bạn
    appendMsg(text, 'user');
    input.value = '';

    // Hiển thị trạng thái đang suy nghĩ
    const loadingId = 'load-' + Date.now();
    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'msg ai typing';
    loadingDiv.id = loadingId;
    loadingDiv.innerText = "Đang truy xuất dữ liệu...";
    chatContent.appendChild(loadingDiv);

    try {
      const result = await model.generateContent(text);
      const response = await result.response;
      const aiText = response.text();
      
      // Xóa dòng loading và thay bằng câu trả lời thật
      document.getElementById(loadingId).remove();
      appendMsg(aiText, 'ai');
    } catch (error) {
      document.getElementById(loadingId).innerText = "LỖI: Kiểm tra API Key hoặc kết nối.";
      console.error(error);
    }
  }

  function appendMsg(text, type) {
    const chatContent = document.getElementById('chat-content');
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.innerText = text;
    chatContent.appendChild(div);
    chatContent.scrollTop = chatContent.scrollHeight;
  }

  // Cho phép nhấn Enter để gửi
  document.getElementById('userInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') askGemini();
  });
</script>

</body>
</html>
